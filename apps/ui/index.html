<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw AI Trading</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-hover: #27272a;
            --border: #27272a;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }
        .status-badge.offline {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .panel:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .panel h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .value-display {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .value-display span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        button {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover { background: var(--surface-hover); }

        button.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        button.primary:hover { background: var(--primary-hover); }

        button.danger {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        button.danger:hover { background: var(--danger-hover); }
        
        button.success {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th { color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        
        tbody tr:hover { background: rgba(255,255,255,0.02); }

        .buy { color: var(--success); }
        .sell { color: var(--danger); }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OpenClaw Trading</h1>
            <div id="systemStatus" class="status-badge offline">
                <div class="status-dot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <aside class="sidebar">
            <div class="panel">
                <h2>Agent Control</h2>
                <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                    <button id="btnStart" class="success" style="flex: 1;" onclick="toggleAgent('start')">▶ Start</button>
                    <button id="btnStop" class="danger" style="flex: 1;" onclick="toggleAgent('stop')">■ Stop</button>
                </div>
            </div>

            <div class="panel">
                <h2>Guardrails</h2>
                <form id="guardrailsForm" onsubmit="saveGuardrails(event)" class="form-group">
                    <div class="form-group">
                        <label>Max Position Size (BTC)</label>
                        <input type="number" id="grSize" step="0.001" required>
                    </div>
                    <div class="form-group">
                        <label>Max Leverage</label>
                        <input type="number" id="grLev" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label>Daily Loss Limit (USD)</label>
                        <input type="number" id="grLoss" step="1" required>
                    </div>
                    <button type="submit" class="primary" style="margin-top: 0.5rem;">Save Limits</button>
                </form>
            </div>
            
            <div class="panel">
                <h2>Whitelisted Wallets</h2>
                <ul id="walletList" style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; color: var(--text-muted); font-size: 0.875rem;">
                    <li>No wallets</li>
                </ul>
                <form onsubmit="addWallet(event)" class="form-group" style="flex-direction: row;">
                    <input type="text" id="newWallet" placeholder="0x..." required style="flex: 1;">
                    <button type="submit" class="primary">+</button>
                </form>
            </div>
        </aside>

        <main class="main-content">
            <div class="grid-2">
                <div class="panel">
                    <h2>Market: BTC/USDT</h2>
                    <div class="value-display" id="marketPrice">--.-- <span>USD</span></div>
                </div>
                
                <div class="panel">
                    <h2>Withdrawable Ledger</h2>
                    <div class="value-display" style="color: var(--success);" id="ledgerBalance">--.-- <span>USD</span></div>
                    <form onsubmit="withdraw(event)" class="form-group" style="flex-direction: row; margin-top: auto;">
                        <select id="withdrawWallet" style="flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 8px;">
                            <option value="">Select Wallet</option>
                        </select>
                        <input type="number" id="withdrawAmount" placeholder="Amount" step="0.01" style="width: 100px;" required>
                        <button type="submit">Sweep</button>
                    </form>
                </div>
            </div>

            <div class="panel" style="flex: 1;">
                <h2>Recent Trades</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Side</th>
                                <th>Pair</th>
                                <th>Amount</th>
                                <th>Price</th>
                                <th>Total</th>
                                <th>Reasoning</th>
                            </tr>
                        </thead>
                        <tbody id="tradesBody">
                            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <div id="toast" class="toast">Action successful</div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:8000' : 'http://api:8000';

        function showToast(msg, isError=false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.borderLeft = `4px solid ${isError ? 'var(--danger)' : 'var(--success)'}`;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        async function fetchAPI(endpoint, options={}) {
            try {
                const res = await fetch(API + endpoint, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...options.headers }
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'API Error');
                }
                return await res.json();
            } catch (e) {
                console.error(e);
                showToast(e.message, true);
                throw e;
            }
        }

        async function pollHealth() {
            try {
                const data = await fetchAPI('/health');
                const badge = document.getElementById('systemStatus');
                const txt = document.getElementById('statusText');
                
                badge.classList.remove('offline');
                badge.querySelector('.status-dot').style.animation = 'none';
                
                if (data.agent_running) {
                    txt.textContent = 'Agent Active';
                    badge.style.color = 'var(--primary)';
                    badge.style.borderColor = 'rgba(59, 130, 246, 0.2)';
                    badge.style.background = 'rgba(59, 130, 246, 0.1)';
                    document.getElementById('btnStart').style.opacity = '0.5';
                    document.getElementById('btnStart').disabled = true;
                    document.getElementById('btnStop').style.opacity = '1';
                    document.getElementById('btnStop').disabled = false;
                } else {
                    txt.textContent = 'Agent Stopped';
                    badge.style.color = 'var(--warning)';
                    badge.style.borderColor = 'rgba(245, 158, 11, 0.2)';
                    badge.style.background = 'rgba(245, 158, 11, 0.1)';
                    document.getElementById('btnStart').style.opacity = '1';
                    document.getElementById('btnStart').disabled = false;
                    document.getElementById('btnStop').style.opacity = '0.5';
                    document.getElementById('btnStop').disabled = true;
                }
            } catch (e) {
                const badge = document.getElementById('systemStatus');
                badge.classList.add('offline');
                document.getElementById('statusText').textContent = 'API Offline';
            }
        }

        async function toggleAgent(action) {
            await fetchAPI(`/agent/${action}`, { method: 'POST' });
            showToast(`Agent ${action}ed`);
            pollHealth();
        }

        async function loadGuardrails() {
            const data = await fetchAPI('/guardrails');
            document.getElementById('grSize').value = data.max_position_size;
            document.getElementById('grLev').value = data.max_leverage;
            document.getElementById('grLoss').value = data.daily_loss_limit;
        }

        async function saveGuardrails(e) {
            e.preventDefault();
            await fetchAPI('/guardrails', {
                method: 'POST',
                body: JSON.stringify({
                    max_position_size: parseFloat(document.getElementById('grSize').value),
                    max_leverage: parseFloat(document.getElementById('grLev').value),
                    daily_loss_limit: parseFloat(document.getElementById('grLoss').value),
                    is_active: true
                })
            });
            showToast('Guardrails updated');
        }

        async function loadWallets() {
            const data = await fetchAPI('/wallets');
            const list = document.getElementById('walletList');
            const select = document.getElementById('withdrawWallet');
            
            if (data.wallets.length > 0) {
                list.innerHTML = data.wallets.map(w => `<li>• ${w.address.substring(0,8)}...${w.address.substring(w.address.length-4)}</li>`).join('');
                select.innerHTML = '<option value="">Select Wallet</option>' + data.wallets.map(w => `<option value="${w.address}">${w.address.substring(0,6)}...${w.address.substring(w.address.length-4)}</option>`).join('');
            }
        }

        async function addWallet(e) {
            e.preventDefault();
            const input = document.getElementById('newWallet');
            await fetchAPI('/wallets', { method: 'POST', body: JSON.stringify({address: input.value}) });
            input.value = '';
            showToast('Wallet whitelisted');
            loadWallets();
        }

        async function loadMarket() {
            try {
                const data = await fetchAPI('/markets');
                if (data.markets.length > 0) {
                    const price = data.markets[0].last || data.markets[0].ask;
                    if(price) {
                        document.getElementById('marketPrice').innerHTML = `${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} <span>USD</span>`;
                    }
                }
            } catch (e) {}
        }

        async function loadLedger() {
            try {
                const data = await fetchAPI('/ledger');
                document.getElementById('ledgerBalance').innerHTML = `${data.withdrawal_balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} <span>USD</span>`;
            } catch (e) {}
        }

        async function withdraw(e) {
            e.preventDefault();
            const addr = document.getElementById('withdrawWallet').value;
            const amt = document.getElementById('withdrawAmount').value;
            if(!addr) return showToast('Select a wallet', true);
            
            try {
                await fetchAPI('/withdraw', {
                    method: 'POST',
                    body: JSON.stringify({ amount: parseFloat(amt), wallet_address: addr })
                });
                showToast(`Withdrew $${amt}`);
                document.getElementById('withdrawAmount').value = '';
                loadLedger();
            } catch(e) {}
        }

        async function loadTrades() {
            try {
                const data = await fetchAPI('/trades');
                const tbody = document.getElementById('tradesBody');
                if (data.trades.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No trades yet</td></tr>';
                    return;
                }
                tbody.innerHTML = data.trades.map(t => {
                    const total = t.qty * t.price;
                    return `
                        <tr>
                            <td class="${t.side}" style="font-weight: 600; text-transform: uppercase;">${t.side}</td>
                            <td>${t.pair}</td>
                            <td>${t.qty}</td>
                            <td>$${t.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td>$${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td style="font-size: 0.75rem; color: var(--text-muted); max-width: 300px;">${t.reasoning || 'N/A'}</td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {}
        }

        // Init
        pollHealth();
        loadGuardrails();
        loadWallets();
        loadMarket();
        loadLedger();
        loadTrades();

        // Loops
        setInterval(pollHealth, 5000);
        setInterval(loadMarket, 5000);
        setInterval(() => {
            loadLedger();
            loadTrades();
        }, 10000);
    </script>
</body>
</html>
