<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Trading Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h1 { color: #38bdf8; margin-bottom: 1.5rem; }
    h2 { color: #94a3b8; margin: 1.5rem 0 0.5rem; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .status { padding: 0.5rem 1rem; border-radius: 0.5rem; display: inline-block; margin-bottom: 1rem; }
    .status.healthy { background: #064e3b; color: #6ee7b7; }
    .status.unhealthy { background: #7f1d1d; color: #fca5a5; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; }
    th { color: #64748b; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
    td { font-variant-numeric: tabular-nums; }
    .buy { color: #4ade80; }
    .sell { color: #f87171; }
    .loading { color: #64748b; font-style: italic; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>OpenClaw Trading Platform</h1>

  <div id="healthBox" class="status loading">Checking API...</div>

  <h2>Markets</h2>
  <table>
    <thead><tr><th>Pair</th><th>Bid</th><th>Ask</th><th>Spread</th></tr></thead>
    <tbody id="marketsBody"><tr><td colspan="4" class="loading">Loading...</td></tr></tbody>
  </table>

  <h2>Recent Trades</h2>
  <table>
    <thead><tr><th>ID</th><th>Pair</th><th>Side</th><th>Qty</th><th>Price</th></tr></thead>
    <tbody id="tradesBody"><tr><td colspan="5" class="loading">Loading...</td></tr></tbody>
  </table>

  <script>
    const API = window.location.hostname === 'localhost'
      ? 'http://localhost:8000'
      : 'http://api:8000';

    async function loadHealth() {
      const el = document.getElementById('healthBox');
      try {
        const r = await fetch(API + '/health');
        const d = await r.json();
        el.textContent = 'API: ' + d.status;
        el.className = 'status ' + (d.status === 'healthy' ? 'healthy' : 'unhealthy');
      } catch (e) {
        el.textContent = 'API: unreachable';
        el.className = 'status unhealthy';
      }
    }

    async function loadMarkets() {
      const tbody = document.getElementById('marketsBody');
      try {
        const r = await fetch(API + '/markets');
        const d = await r.json();
        tbody.innerHTML = d.markets.map(function(m) {
          return '<tr><td>' + m.pair + '</td><td>' + m.bid.toFixed(2) + '</td><td>' + m.ask.toFixed(2) + '</td><td>' + (m.ask - m.bid).toFixed(2) + '</td></tr>';
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="error">Failed to load markets</td></tr>';
      }
    }

    async function loadTrades() {
      const tbody = document.getElementById('tradesBody');
      try {
        const r = await fetch(API + '/trades');
        const d = await r.json();
        tbody.innerHTML = d.trades.map(function(t) {
          return '<tr><td>' + t.id + '</td><td>' + t.pair + '</td><td class="' + t.side + '">' + t.side.toUpperCase() + '</td><td>' + t.qty + '</td><td>' + t.price.toFixed(2) + '</td></tr>';
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" class="error">Failed to load trades</td></tr>';
      }
    }

    loadHealth();
    loadMarkets();
    loadTrades();
    setInterval(loadHealth, 10000);
    setInterval(loadMarkets, 15000);
    setInterval(loadTrades, 15000);
  </script>
</body>
</html>
