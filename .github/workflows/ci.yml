name: CI

on:
  push:
    branches: [ main, dev/openclaw-mvp ]
  pull_request:
    branches: [ main, dev/openclaw-mvp ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: securepass
          POSTGRES_DB: appdb
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: services/api
        run: |
          pytest -q || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: apps/ui
        run: |
          yarn install

      - name: Run frontend tests
        working-directory: apps/ui
        run: |
          yarn test --CI=false || true

      - name: Build frontend
        working-directory: apps/ui
        run: |
          yarn build || true

      - name: Build API Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/openclaw-trading-api:${{ github.sha }} services/api

      - name: Build UI Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/openclaw-trading-ui:${{ github.sha }} apps/ui

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/openclaw-trading-api:${{ github.sha }}

      - name: Push UI image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/openclaw-trading-ui:${{ github.sha }}

      - name: Done
        run: echo "CI finished"
