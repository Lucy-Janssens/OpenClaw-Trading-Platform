name: CI

on:
  push:
    branches: [ main, dev/openclaw-mvp ]
  pull_request:
    branches: [ main, dev/openclaw-mvp ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: securepass
          POSTGRES_DB: appdb
        options: >-
          --health-cmd pg_isready -U appuser -d appdb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        working-directory: projects/openclaw-trading/services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: projects/openclaw-trading/services/api
        run: |
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: projects/openclaw-trading/apps/ui
        run: |
          yarn install

      - name: Run frontend tests/build
        working-directory: projects/openclaw-trading/apps/ui
        run: |
          yarn test --CI=false || true
          yarn build || true

      - name: Build Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/openclaw-trading-api:dev-openclaw-mvp projects/openclaw-trading/services/api
          docker build -t ghcr.io/${{ github.repository_owner }}/openclaw-trading-ui:dev-openclaw-mvp projects/openclaw-trading/apps/ui

      - name: Push images to GitHub Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/openclaw-mvp'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/openclaw-trading-api:dev-openclaw-mvp
          docker push ghcr.io/${{ github.repository_owner }}/openclaw-trading-ui:dev-openclaw-mvp

      - name: Cleanup
        run: echo CI finished
